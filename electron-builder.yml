appId: fr.krashland.launcher
productName: Krashland Launcher
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraMetadata:
  main: out/main/index.js

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: resources/icon.icns
  category: public.app-category.games

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: resources/icon.png
  category: Game

nsis:
  oneClick: true        # install & updates 100% silencieuses — le script NSIS ferme
  perMachine: false     # proprement le process avant d'écraser les fichiers (évite l'EPERM).
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Dossier cible : %LOCALAPPDATA%\Programs\krashland-launcher (pas besoin de droits admin).
  # quitAndInstall(true, true) dans autoUpdate.js → relance automatique après update.

publish:
  provider: github
  owner: ZKYXYKZ
  repo: krashland-launcher
  private: false
  releaseType: release
